# dropship_demo.yaml — the dropship, and the two ends of one drop.
#
# Walk aft-to-fore into the ship's tunnel, wait (or press the interact key), and
# the blast door shuts and the ship falls two hundred metres onto the surface.
# The door opens and you walk out somewhere else. You never fly it: the ship is
# an entity with a script, not a vehicle, and you ride it because you are
# standing inside its frame.
#
# WHAT THIS LEVEL HAS TO GET RIGHT, and the only reason it is worth reading:
#
#   The way into a moving thing is a FRAME PORTAL, and a frame portal has two
#   halves in two different spaces. The ship's half is in
#   chunks/dropship_hold.yaml (`vest`'s aft edge, `to_frame: world`); this
#   file's half is an edge pointing back at it (`to_frame: dropship`). The two
#   are NOT in the same place. A crossing hands the walker over while they are
#   still up to collision.portalCrossingBand (0.6) short of the line, so each
#   side has to reach past the other's line by more than that band or the walker
#   lands in a sector neither space contains, with no floor under them. Here the
#   ship's line is at z = -3.6 and the level's at z = -1.5, and the ship's
#   vestibule and the level's floor overlap over the two metres in between.
#
#   The doorway segment is also narrow — 1.4 wide against a vestibule 2.6 wide —
#   for the other half of the same rule: the band is a radius, so a walker up to
#   0.6 off the END of the segment crosses too, and has to land inside the far
#   sector as well.
#
# TWO CHUNKS, STACKED. `launch_bay` sits at y = 200 and `surface` at y = 0, over
# the same footprint; which one anything is in is settled by height, the same
# rooms-over-rooms disambiguation any two storeys use. The ship starts in the
# first and the script (drop_height, 200 by default) puts it down in the second.

chunks:

  # ==========================================================================
  # The launch bay, two hundred metres up. One hall, and a docking alcove whose
  # forward edge is the way aboard. Past that edge there is no geometry at all:
  # the ship hangs in the tube beyond it, which is why the alcove is only just
  # bigger than the tunnel plugged into it (3.7 x 2.9 against 3.44 x 2.62).
  # ==========================================================================
  - id: launch_bay
    origin: {x: 0, "y": 200, z: 0}
    rotation: 0
    scale: 1
    points:
      hp_a: {x: -9.0,  "y": -26.0}
      hs_a: {x:  9.0,  "y": -26.0}
      hs_f: {x:  9.0,  "y":  -5.0}
      hp_f: {x: -9.0,  "y":  -5.0}
      gp_a: {x: -1.85, "y":  -5.0}
      gs_a: {x:  1.85, "y":  -5.0}
      gs_f: {x:  1.85, "y":  -1.5}
      gp_f: {x: -1.85, "y":  -1.5}
    sectors:
      - id: bay_hall
        floor:   {enabled: true, height: 0.0, texture: hull_deck, terrain: false}
        ceiling: {enabled: true, height: 6.0, texture: hull_plate, terrain: false}
        edges:
          - {id: aft,    from: hp_a, to: hs_a, kind: wall, texture: hull_plate, collision: true}
          - {id: stbd,   from: hs_a, to: hs_f, kind: wall, texture: hull_plate, collision: true}
          - {id: fwd_s,  from: hs_f, to: gs_a, kind: wall, texture: hull_plate, collision: true}
          - {id: gate,   from: gs_a, to: gp_a, kind: portal, to_sector: bay_gate, draw_gap: true, gap_texture: hull_plate}
          - {id: fwd_p,  from: gp_a, to: hp_f, kind: wall, texture: hull_plate, collision: true}
          - {id: port,   from: hp_f, to: hp_a, kind: wall, texture: hull_plate, collision: true}

      - id: bay_gate
        floor:   {enabled: true, height: 0.0, texture: hull_deck, terrain: false}
        ceiling: {enabled: true, height: 2.9, texture: hull_plate, terrain: false}
        edges:
          - {id: aft,   from: gp_a, to: gs_a, kind: portal, to_sector: bay_hall, draw_gap: true, gap_texture: hull_plate}
          - {id: stbd,  from: gs_a, to: gs_f, kind: wall, texture: hull_plate, collision: true}
          # The way aboard. No `to_sector`: what is on the far side is a sector
          # of the ship's own chunk, and which one is settled by where the ship
          # has got to, not by a name written here.
          - {id: mouth, from: gs_f, to: gp_f, kind: portal, to_frame: dropship, draw_gap: false}
          - {id: port,  from: gp_f, to: gp_a, kind: wall, texture: hull_plate, collision: true}

  # ==========================================================================
  # The surface. Open ground either side of the line the ship lands on, so that
  # walking out of it lands on something and walking round it is possible.
  #
  # The band directly under the hull is a hidden, PINNED wall rather than the
  # portal the shared edge would otherwise be inferred into: the ship's own
  # collision flags are all off (an entity's volume is a box and the way in is a
  # hole in one face of it), so without this one could walk straight through the
  # hull from behind. Pinned on both sides, because InferPortals promotes a
  # shared wall to a portal unless told not to.
  # ==========================================================================
  - id: surface
    origin: {x: 0, "y": 0, z: 0}
    rotation: 0
    scale: 1
    points:
      lz_pa: {x: -60.0, "y": -70.0}
      lz_sa: {x:  60.0, "y": -70.0}
      lz_sf: {x:  60.0, "y":  -1.5}
      lz_pf: {x: -60.0, "y":  -1.5}
      w_s:   {x:   7.0, "y":  -1.5}
      d_s:   {x:   0.7, "y":  -1.5}
      d_p:   {x:  -0.7, "y":  -1.5}
      w_p:   {x:  -7.0, "y":  -1.5}
      ap_sf: {x:  60.0, "y":  40.0}
      ap_pf: {x: -60.0, "y":  40.0}
    sectors:
      - id: lz_ground
        floor:   {enabled: true, height: 0.0, texture: sand, terrain: false}
        ceiling: {enabled: false, height: 60.0, texture: rock, terrain: false}
        edges:
          - {id: aft,   from: lz_pa, to: lz_sa, kind: wall, texture: rock, collision: true, hidden: true}
          - {id: stbd,  from: lz_sa, to: lz_sf, kind: wall, texture: rock, collision: true, hidden: true}
          - {id: open_s, from: lz_sf, to: w_s, kind: portal, to_sector: lz_apron, draw_gap: true, gap_texture: sand}
          - {id: hull_s, from: w_s, to: d_s, kind: wall, texture: rock, collision: true, hidden: true, pinned: true}
          - {id: mouth, from: d_s, to: d_p, kind: portal, to_frame: dropship, draw_gap: false}
          - {id: hull_p, from: d_p, to: w_p, kind: wall, texture: rock, collision: true, hidden: true, pinned: true}
          - {id: open_p, from: w_p, to: lz_pf, kind: portal, to_sector: lz_apron, draw_gap: true, gap_texture: sand}
          - {id: port,  from: lz_pf, to: lz_pa, kind: wall, texture: rock, collision: true, hidden: true}

      - id: lz_apron
        floor:   {enabled: true, height: 0.0, texture: sand, terrain: false}
        ceiling: {enabled: false, height: 60.0, texture: rock, terrain: false}
        edges:
          - {id: open_p, from: lz_pf, to: w_p, kind: portal, to_sector: lz_ground, draw_gap: true, gap_texture: sand}
          - {id: hull_p, from: w_p, to: d_p, kind: wall, texture: rock, collision: true, hidden: true, pinned: true}
          - {id: hull_m, from: d_p, to: d_s, kind: wall, texture: rock, collision: true, hidden: true, pinned: true}
          - {id: hull_s, from: d_s, to: w_s, kind: wall, texture: rock, collision: true, hidden: true, pinned: true}
          - {id: open_s, from: w_s, to: lz_sf, kind: portal, to_sector: lz_ground, draw_gap: true, gap_texture: sand}
          - {id: stbd,  from: lz_sf, to: ap_sf, kind: wall, texture: rock, collision: true, hidden: true}
          - {id: fwd,   from: ap_sf, to: ap_pf, kind: wall, texture: rock, collision: true, hidden: true}
          - {id: port,  from: ap_pf, to: lz_pf, kind: wall, texture: rock, collision: true, hidden: true}

# The ship, parked with its tunnel through the alcove's mouth. Its position is
# the deck of its own hold: y = 200 puts that level with the bay's floor, which
# is what makes walking in a step over a three-centimetre lip rather than a
# climb. `drop_height` is measured from here, so 200 lands it on the surface.
entities:
  - id: dropship
    type: dropship
    position: {x: 0.0, "y": 200.0, z: 0.0}
    rotation: {x: 0.0, "y": 0.0, z: 0.0}
    params:
      engine: {type: str, value: dropship_engine}

# The engine, riding the ship. An attached sound's position is an offset in the
# thing it rides rather than a world one, so this is the middle of the hold and
# stays there all the way down. The script switches it on when the ship lets go
# and off when it touches down (the `engine` param above names it).
sounds:
  - id: dropship_engine
    clip: hum
    position: {x: 0.0, "y": 1.4, z: 3.0}
    playing: false
    loop: true
    gain: 0.9
    ref_distance: 8.0
    max_distance: 90.0
    attach: {entity: dropship}

spawn:
  position: {x: 0.0, "y": 200.1, z: -14.0}
  # Facing +Z, up the bay towards the ship: the spawn's arrow points along its
  # local +X, so a quarter turn the other way about Y is what aims it at +Z.
  rotation: {x: 0.0, "y": -1.5708, z: 0.0}

sky:
  kind: gradient
  zenith:  {r: 0.15, g: 0.19, b: 0.29}
  horizon: {r: 0.62, g: 0.48, b: 0.36}
  ground:  {r: 0.24, g: 0.19, b: 0.16}

fog:
  mode: linear
  color: {r: 0.58, g: 0.47, b: 0.38}
  start: 40.0
  end: 260.0
  sky_blend: 0.7

lights:
  # The ambient is doing more work than usual: a light cannot ride a frame, so
  # there is no lamp that stays inside the hold on the way down, and the ambient
  # is what keeps the ride from being a black screen.
  global:
    color: {r: 0.78, g: 0.82, b: 0.95}
    brightness: 0.34
  directional:
    - id: sun
      direction: {x: -0.42, "y": -0.80, z: 0.43}
      color: {r: 1.0, g: 0.92, b: 0.80}
      brightness: 0.85
      cast_shadows: true
      shadow_strength: 0.7
  point:
    - id: bay_lamp_aft
      position: {x: 0.0, "y": 205.0, z: -20.0}
      color: {r: 1.0, g: 0.74, b: 0.42}
      brightness: 1.5
      radius: 18.0
      cast_shadows: false
      shadow_strength: 0.0
    - id: bay_lamp_gate
      position: {x: 0.0, "y": 204.4, z: -7.5}
      color: {r: 1.0, g: 0.70, b: 0.38}
      brightness: 1.7
      radius: 16.0
      cast_shadows: false
      shadow_strength: 0.0
    - id: lz_flood
      position: {x: 0.0, "y": 3.2, z: -8.0}
      color: {r: 0.72, g: 0.84, b: 1.0}
      brightness: 1.2
      radius: 22.0
      cast_shadows: false
      shadow_strength: 0.0
