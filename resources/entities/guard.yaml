# guard.yaml — a patrolling sentry: the sample AI agent.
#
# Everything it does comes from the `ai:` block at the bottom. It needs no
# script to patrol, notice the player, give chase and stop at arm's length;
# scripts/guard.flang is only what it does ABOUT those things.
#
# PLACING ONE. Add > Entity > guard, then give the level somewhere to patrol:
# place two or more volumes, tick AI Objective on each, and tag them `patrol`.
# The guard walks them in the order the level lists them, pausing at each for
# the volume's Duration, and loops. Tick "Show navigation" in its AI group to
# see where it can walk and the route it will take.
#
# The body is two NON-SOLID box brushes — a torso and a visor on its front — so
# there is something to see without a model. Non-solid, because a body is not a
# room: the bounds below are what collides, and a solid brush would be a hull
# other bodies could climb aboard. Swap them for a model attachment in the
# entity editor. The visor marks the way it faces, which is its local -Z.

id: guard
description: >-
  A patrolling sentry. Walks the volumes tagged #patrol, hunts the player on
  sight and closes to arm's length. The sample AI agent.
tags: [guard, ai]

bounding: cylinder
bound_half_x: 0.3
bound_half_y: 0.9
bound_half_z: 0.3
bound_offset: {x: 0, y: 0.9, z: 0}

collision: {world: true, entities: true, gravity: true}

script: scripts/guard.flang

brushes:
  - id: body
    solid: false
    verts: [-0.3, 0, -0.3, 0.3, 0, -0.3, -0.3, 1.8, -0.3, 0.3, 1.8, -0.3,
            -0.3, 0, 0.3, 0.3, 0, 0.3, -0.3, 1.8, 0.3, 0.3, 1.8, 0.3]
    faces:
      - {indices: [0, 4, 6, 2]}
      - {indices: [5, 1, 3, 7]}
      - {indices: [0, 1, 5, 4]}
      - {indices: [2, 6, 7, 3]}
      - {indices: [1, 0, 2, 3]}
      - {indices: [4, 5, 7, 6]}
  - id: visor
    solid: false
    verts: [-0.22, 1.48, -0.37, 0.22, 1.48, -0.37, -0.22, 1.62, -0.37, 0.22, 1.62, -0.37,
            -0.22, 1.48, -0.29, 0.22, 1.48, -0.29, -0.22, 1.62, -0.29, 0.22, 1.62, -0.29]
    faces:
      - {indices: [0, 4, 6, 2]}
      - {indices: [5, 1, 3, 7]}
      - {indices: [0, 1, 5, 4]}
      - {indices: [2, 6, 7, 3]}
      - {indices: [1, 0, 2, 3]}
      - {indices: [4, 5, 7, 6]}

ai:
  speed: 2.5
  targets: [player]
  sight_range: 18
  fov: 110
  lose_time: 4
  attack_range: 1.4
  objectives: ["#patrol"]
  loop: true
