# dropship.yaml — a sci-fi assault shuttle with a hold you walk into.
#
# The type is four things bolted together, and each is in the file it belongs
# in rather than here:
#
#   models/dropship.fmdl        the hull, generated by cmd/genmodels
#   models/dropship_glass.fmdl  the canopy, a second attachment because a model
#                               wears one texture and glass is not plating
#   chunks/dropship_hold.yaml   the INSIDE, as world geometry bound to this
#                               entity's frame — sectors, because a room the
#                               player walks around in cannot be triangles
#   scripts/dropship.flang      the door and the drop
#
# It is deliberately NOT a vehicle: no `vehicle:` block, no seats, nothing to
# steer. A frame is a property of owning a chunk, not of being drivable, so the
# hold is carried around and walkable either way — and this ship is ridden, not
# flown. The script moves it.
#
# It is also not solid. Every collision flag is off, which is what lets someone
# walk up to the tunnel's mouth and through it: an entity's bounding volume is a
# box, the way in is a hole in the middle of one face, and a box cannot have a
# hole in it. What is solid is the hold — those are real walls — and whatever
# the level puts around the ship outside. The bounds below are what the interact
# key and the editor's picking use, not what stops anyone.
#
# PLACING ONE. The hold's aft edge is a frame portal (`to_frame: world`), and
# the level has to meet it: a sector of its own whose edge is a portal back to
# this entity, parked so the two lines are about two metres apart and the
# floors overlap in between. resources/levels/dropship_demo.yaml is a worked
# example and chunks/dropship_hold.yaml explains why the overlap is needed.
#
# RENAMING AN INSTANCE. The two params below name sectors of the materialised
# hold, whose IDs are built from the instance's own ID — `<id>.hold.hatch`. An
# instance called something other than `dropship` has to rebind them in its own
# `params:` block, or its door will not move.

id: dropship
description: >-
  Assault shuttle with a walk-in troop hold and a powered blast door. Park it
  against a portal edge, walk in, and the script shuts the door and drops it.
tags: [ship, dropship]

# The whole airframe: x +/-6.35, y -0.02..4.55, z -3.7..11.4. The offset lifts
# the box off the entity's position, which is the deck, to the hull's middle.
bounding: aabb
bound_half_x: 6.35
bound_half_y: 2.29
bound_half_z: 7.55
bound_offset: {x: 0.0, y: 2.27, z: 3.85}

collision: {world: false, entities: false, gravity: false, movable: false}

models:
  - name: hull
    path: models/dropship.fmdl
    texture: hull_plate
  - name: glass
    path: models/dropship_glass.fmdl
    texture: hull_glass
    alpha: 0.55

chunks:
  - name: hold
    file: dropship_hold

script: scripts/dropship.flang
params:
  door: {type: str, value: dropship.hold.hatch}
  bay:  {type: str, value: dropship.hold.bay}
