# dropship.yaml — a sci-fi assault shuttle with a hold you walk into.
#
# The type is four things bolted together, and each is in the file it belongs
# in rather than here:
#
#   models/dropship.fmdl        the hull, generated by cmd/genmodels
#   models/dropship_glass.fmdl  the canopy, a second attachment because a model
#                               wears one texture and glass is not plating
#   scripts/dropship.flang      the door and the drop
#
# …and the INSIDE, which is not in a file of its own any more: the `brushes:`
# block at the bottom is the hold, authored in this type's own coordinates and
# materialised as a chunk bound to its frame. A room the player walks around in
# cannot be triangles, and it is no longer a chunk file the type points at
# either — a type owns its solid. Shape it in the entity editor.
#
# It is deliberately NOT a vehicle: no `vehicle:` block, no seats, nothing to
# steer. A frame is a property of carrying geometry, not of being drivable, so
# the hold is carried around and walkable either way — and this ship is ridden,
# not flown. The script moves it.
#
# The bounds below are what the interact key and the editor's picking use, not
# what stops anyone: what is solid is the brushes. Every collision flag is off
# because an entity that carries brushes presents THOSE rather than its box, and
# a box could not have the doorway in it.
#
# PLACING ONE. Park it on the ground and walk in through the aft opening. There
# is no portal to line up any more: a body that walks inside an entity's own
# solid is handed into that entity's frame by containment, which is how it comes
# to be carried when the ship drops.
#
# RENAMING AN INSTANCE. The param below names a brush of the materialised hold,
# whose ID is built from the instance's own ID — `<id>.hatch`. An instance called
# something other than `dropship` has to rebind it in its own `params:` block, or
# its door will not move.

id: dropship
description: >-
  Assault shuttle with a walk-in troop hold and a powered blast door. Park it
  against a portal edge, walk in, and the script shuts the door and drops it.
tags: [ship, dropship]

# The whole airframe: x +/-6.35, y -0.02..4.55, z -3.7..11.4. The offset lifts
# the box off the entity's position, which is the deck, to the hull's middle.
bounding: aabb
bound_half_x: 6.35
bound_half_y: 2.29
bound_half_z: 7.55
bound_offset: {x: 0.0, y: 2.27, z: 3.85}

collision: {world: false, entities: false, gravity: false, movable: false}

models:
  - name: hull
    path: models/dropship.fmdl
    texture: hull_plate
  - name: glass
    path: models/dropship_glass.fmdl
    texture: hull_glass
    alpha: 0.55

script: scripts/dropship.flang
params:
  door: {type: str, value: dropship.hatch}
  door_shut_x: {type: float, value: 0.0}
  door_open_x: {type: float, value: -4.4}

# The hold. Authored around the entity's own origin — the deck is y=0, the ship
# faces −Z — and materialised as one frame-owned chunk when an instance is
# placed. `hatch` is the blast door: marked dynamic so the script may write its
# position, authored SHUT because authored geometry is always a brush's rest
# state, and slid to port on spawn into the space between the hold's wall and
# the hull's skin. It is moved in the SHIP's coordinates rather than the world's,
# which is what lets it stay shut while the ship is two hundred metres into a
# fall.
brushes:
- id: deck
  verts:
  - -2.45
  - -0.25
  - 0.35000038
  - 2.45
  - -0.25
