# Scenery. No attributes and no motion — it is a shape with a name, which is
# enough for a script to address it with `@rock_03` or `#scenery`.
id: rock
description: An immovable boulder.
tags:
  - prop
  - scenery

# Immovable scenery: it stops things that run into it and is never itself
# moved, so gravity and world collision would have nothing to do. Note that
# `entities: true` is still needed — solidity is mutual, and something has to
# opt in on this side too.
collision:
  entities: true
  movable: false

bounding: sphere
bound_half_x: 0.5
bound_half_y: 0.3
bound_half_z: 0.5
bound_offset: {x: 0.0, y: 0.3, z: 0.0}

models:
  - name: body
    path: models/rock.obj
    texture: rock
    offset: {x: 0.0, y: 0.3, z: 0.0}
