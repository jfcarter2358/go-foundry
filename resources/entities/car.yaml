# Two attachments on one entity: the hull, and a marker riding above it.
#
# This is what the model list is for — the two have their own offsets and their
# own animation sets, and the entity's own rotation carries both. Move the
# entity and the marker goes with it; rotate the marker and the hull stays put.
id: car
description: A drivable-looking hull with a separate roof marker.
tags:
  - prop
  - vehicle

# Solid against the world and against other entities, but no gravity: it is
# driven, so what moves it vertically should be the game rather than a fall.
collision:
  world: true
  entities: true

bounding: cylinder
bound_half_x: 2.0
bound_half_y: 0.75
bound_half_z: 1.0
bound_offset: {x: 0.0, y: 0.75, z: 0.0}

models:
  - name: hull
    path: models/car.obj
    texture: concrete
    offset: {x: 0.0, y: 0.75, z: 0.0}

  - name: marker
    path: models/box.obj
    texture: brick
    offset: {x: 0.0, y: 1.8, z: 0.0}
    scale: {x: 0.3, y: 0.3, z: 0.3}

attributes:
  # A float rather than an int so a script can scale it smoothly. Note that
  # `40` would load as 40.0 here — the declared type wins over how it is written.
  top_speed: {type: float, value: 12.5}
  driver: {type: str, value: ""}
  engine_on: {type: bool, value: false}
