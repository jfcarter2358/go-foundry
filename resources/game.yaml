# game.yaml — what this install is, when the engine is built as a game.
#
# Read only by a release build (`go build -tags release`, or `make release-linux`); a
# development build ignores it and boots into the editor on a blank level. See
# internal/game/manifest.go and internal/app/startup_release.go.
#
# `start_screen` is where the main menu belongs rather than in the level's own
# `ui:` list: a menu is a property of the game, not of the beach it happens to
# be drawn over, and a level reached later must not put it back up. The cost is
# that a development build — which never reads this file — enters play with no
# menu; `make release-linux` is how to see one.
title: Foundry
version: 0.1.0
start_level: beachhead
start_screen: menu
window:
  width: 1600
  height: 900
