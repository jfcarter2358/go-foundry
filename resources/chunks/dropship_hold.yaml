# dropship_hold.yaml — the inside of the dropship, as a chunk.
#
# Attached to the `dropship` entity type (resources/entities/dropship.yaml),
# which materialises it as a chunk bound to that entity's frame: geometry the
# ship carries around, walkable while it moves. Authored around the entity's own
# origin, +Z forward, y = 0 on the deck. The numbers here are the same ones
# cmd/genmodels/main.go builds the hull's skin from, and are named there.
#
# Three sectors, aft to fore:
#
#   vest    the boarding vestibule inside the aft tunnel. Its aft edge is the
#           FRAME PORTAL (`to_frame: world`) — the way in and the way out.
#   hatch   thirty centimetres of doorway: the blast door's own thickness.
#   bay     the troop hold.
#
# THE DOOR IS THIS FILE'S CEILING, not a mesh. `hatch`'s ceiling is at 2.4 when
# the door is open and 0.0 when it is shut, and the script drives it between the
# two (resources/scripts/dropship.flang). Two things fall out of that and both
# are the reason it is built this way:
#
#   * It DRAWS. A portal with `draw_gap` fills the height difference between two
#     sectors with wall geometry, so as `hatch`'s ceiling descends, the portals
#     either side of it grow a quad down from their neighbour's ceiling — one
#     face of the leaf towards the bay, one towards the vestibule, thirty
#     centimetres apart. That is the door, and it is rebuilt every time the
#     height is written (world.RebuildGaps).
#   * It STOPS PEOPLE. ResolveCeilingEntry refuses a move into a sector whose
#     ceiling is at or below the floor being left. Shut, `hatch`'s ceiling is at
#     0.0, which is the bay's floor and below the vestibule's — so neither side
#     admits anyone, in either direction, with nothing to arrange per frame.
#
# The 6cm well in `hatch`'s floor is what keeps the shut door from being a
# ceiling underneath its own floor: it is the track the leaf drops into.
#
# THE OVERLAP AT THE AFT END is deliberate and is the one thing to preserve when
# moving this ship's doorway. A frame portal hands the walker over while they
# are still up to collision.portalCrossingBand (0.6) short of the line, so the
# far side has to be a place they can stand: the level's own floor must reach
# past this portal, and `vest` must reach past the level's, by more than that
# band each. `vest` is 3.3 long for that reason, and the level parks the ship so
# the two portal lines are about two metres apart. Co-locating them drops the
# walker into a sector neither space contains.

id: dropship_hold

points:
  # the hold
  bay_ps: {x: -2.2, "y": 0.0}    # port, aft   (the bulkhead the door is in)
  bay_sa: {x:  2.2, "y": 0.0}    # starboard, aft
  bay_sf: {x:  2.2, "y": 7.2}    # starboard, forward
  bay_pf: {x: -2.2, "y": 7.2}    # port, forward
  # the doorway, where the bay's aft bulkhead is split for it
  door_p: {x: -1.4, "y": 0.0}
  door_s: {x:  1.4, "y": 0.0}
  # the door's aft face, split again for the narrower vestibule
  jamb_p: {x: -1.4, "y": -0.3}
  jamb_s: {x:  1.4, "y": -0.3}
  vest_p: {x: -1.3, "y": -0.3}
  vest_s: {x:  1.3, "y": -0.3}
  # the aft lip of the tunnel: the frame portal's line
  lip_p:  {x: -1.3, "y": -3.6}
  lip_s:  {x:  1.3, "y": -3.6}

sectors:
  # ---------------------------------------------------------------- the hold --
  - id: bay
    floor:   {enabled: true, height: 0.0, texture: hull_deck, terrain: false}
    ceiling: {enabled: true, height: 2.6, texture: hull_plate, terrain: false}
    edges:
      - {id: aft_p,  from: bay_ps, to: door_p, kind: wall,   texture: hull_plate, collision: true}
      - {id: door,   from: door_p, to: door_s, kind: portal, to_sector: hatch, draw_gap: true, gap_texture: hull_door, collision: false}
      - {id: aft_s,  from: door_s, to: bay_sa, kind: wall,   texture: hull_plate, collision: true}
      - {id: side_s, from: bay_sa, to: bay_sf, kind: wall,   texture: hull_plate, collision: true}
      - {id: fwd,    from: bay_sf, to: bay_pf, kind: wall,   texture: hull_plate, collision: true}
      - {id: side_p, from: bay_pf, to: bay_ps, kind: wall,   texture: hull_plate, collision: true}

  # ------------------------------------------------------------ the doorway --
  # Thirty centimetres deep, with a six-centimetre well for the leaf to sit in.
  # Its ceiling is the door: 2.4 open, 0.0 shut. Anything that edits this sector
  # has to keep `height` reachable from the script — it is written by name
  # through the `door` param the entity binds.
  - id: hatch
    floor:   {enabled: true, height: -0.06, texture: hull_deck, terrain: false}
    ceiling: {enabled: true, height: 2.4, texture: hull_door, terrain: false}
    edges:
      - {id: jamb_p, from: jamb_p, to: vest_p, kind: wall,   texture: hull_plate, collision: true}
      - {id: sill,   from: vest_p, to: vest_s, kind: portal, to_sector: vest, draw_gap: true, gap_texture: hull_door, collision: false}
      - {id: jamb_s, from: vest_s, to: jamb_s, kind: wall,   texture: hull_plate, collision: true}
      - {id: side_s, from: jamb_s, to: door_s, kind: wall,   texture: hull_plate, collision: true}
      - {id: head,   from: door_s, to: door_p, kind: portal, to_sector: bay, draw_gap: true, gap_texture: hull_door, collision: false}
      - {id: side_p, from: door_p, to: jamb_p, kind: wall,   texture: hull_plate, collision: true}

  # ----------------------------------------------------- the aft vestibule --
  # The floor is three centimetres above the ground the ship parks on, which is
  # what keeps the two surfaces from fighting over the same pixels where they
  # overlap. `mouth` is the frame portal: no `to_sector`, because what is on the
  # far side of it is whatever level this ship is standing in.
  - id: vest
    floor:   {enabled: true, height: 0.03, texture: hull_deck, terrain: false}
    ceiling: {enabled: true, height: 2.25, texture: hull_plate, terrain: false}
    edges:
      - {id: mouth,  from: lip_p,  to: lip_s,  kind: portal, to_frame: world, draw_gap: false, collision: false}
      - {id: side_s, from: lip_s,  to: vest_s, kind: wall,   texture: hull_plate, collision: true}
      - {id: sill,   from: vest_s, to: vest_p, kind: portal, to_sector: hatch, draw_gap: true, gap_texture: hull_door, collision: false}
      - {id: side_p, from: vest_p, to: lip_p,  kind: wall,   texture: hull_plate, collision: true}

origin: {x: 0, "y": 0, z: 0}
rotation: 0
scale: 1
