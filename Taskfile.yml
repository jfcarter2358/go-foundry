# Foundry's build tasks, for go-task (https://taskfile.dev).
#
#   task                 list every task with a description
#   task linux           build the editor and run it from dist/
#   task release-linux   build a shippable game
#
# Variables are overridden the same way `make` took them, on the command line
# or from the environment:
#
#   task runtimes RUNTIMES_DIR=/path/to/my-game/runtimes
#   PRUNE=0 task release-linux

version: '3'

vars:
  # ==========================================================================
  # Release
  # ==========================================================================
  #
  # A release build is the engine with the editor compiled out (`-tags
  # release`, see internal/app/devtools_release.go), staged into an install
  # tree beside the content it can actually reach, and wrapped in something a
  # player can run.
  #
  #   task release-linux        build + stage + tar.gz
  #   task release-windows      cross-build + stage
  #   task installer-linux      the above, plus a .deb
  #   task installer-windows    the above, plus a Setup.exe (needs makensis)
  #   task compile-levels       build every level's .fbsp (part of the release targets)
  #   task release-check        prove the editor is not in the binary
  #   task runtimes             the game binaries an editor's Release window packs
  #   task dist-editor          the editor itself, for a Foundry release on GitHub
  #
  # PRUNE=0 stages the whole content tree instead of only what the game reaches
  # from its manifest. Worth reaching for when a script names a level or a
  # texture by a string it assembles at runtime, which is the one thing the
  # reference walk in internal/pack cannot see.
  #
  # These tasks build the engine's own resources/. A game kept in a project
  # directory of its own is built from the editor running there — its Release
  # window, or `./foundry build-release` — see docs/guide/20-shipping.md.
  BUILD_DIR: '{{.BUILD_DIR | default "build"}}'
  PRUNE: '{{.PRUNE | default "1"}}'
  RELEASE_TAGS: release

  # -s -w drop the symbol table and DWARF: about a third of the binary, and
  # nothing a player's machine has any use for.
  RELEASE_LDFLAGS: -s -w
  # -H windowsgui suppresses the console window that would otherwise open
  # behind the game. The engine logs to a file for exactly this reason (app.go).
  WINDOWS_LDFLAGS: '{{.RELEASE_LDFLAGS}} -H windowsgui'
  # Every cgo build for Windows links mingw's own runtime in. Left dynamic, the
  # exe imports libgcc_s_seh-1.dll and libstdc++-6.dll (imgui is C++), which no
  # Windows machine has unless a mingw toolchain is on its PATH — so it ran on
  # the machine that built it and nowhere else. pack.CheckImports refuses a
  # Windows pack that would need either.
  WINDOWS_STATIC: -extldflags "-static-libgcc -static-libstdc++"

  PRUNE_FLAG: '{{if eq .PRUNE "1"}}-prune{{end}}'

  LINUX_STAGE: '{{.BUILD_DIR}}/install-linux'
  WINDOWS_STAGE: '{{.BUILD_DIR}}/install-windows'

  # Where `task runtimes` puts the release game binaries. An editor running
  # from a game's own project directory looks for them in runtimes/ next to
  # itself (internal/release/player.go).
  RUNTIMES_DIR: '{{.RUNTIMES_DIR | default "dist/runtimes"}}'

  GIT_VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null | sed 's/^v//'
  EDITOR_VERSION: '{{.EDITOR_VERSION | default .GIT_VERSION}}'
  EDITOR_DIST: '{{.EDITOR_DIST | default (printf "%s/editor-dist" .BUILD_DIR)}}'
  EDITOR_RUNTIMES: '{{.BUILD_DIR}}/editor-runtimes'
  EDITOR_PACK: >-
    go run ./cmd/foundrypack editor -version {{.EDITOR_VERSION}} -out {{.EDITOR_DIST}}
    -shaders resources/shaders
    -runtime {{.EDITOR_RUNTIMES}}/foundry-release-windows-amd64.exe
    -runtime {{.EDITOR_RUNTIMES}}/foundry-release-linux-amd64
    -runtime {{.EDITOR_RUNTIMES}}/foundry-setup-windows-amd64.exe
    -runtime resources/SDL2.dll
  # The Score editor's OGG Vorbis and MP3 encoders, for the install's codecs/
  # (docs/score/CODECS.md): the Windows ones are fetched by `task
  # codecs-windows`; a Linux install uses the system's unless CODECS_LINUX
  # names a folder of .so files to carry.
  CODECS_WINDOWS: '{{.CODECS_WINDOWS | default (printf "%s/codecs/windows-amd64" .BUILD_DIR)}}'
  CODECS_LINUX: '{{.CODECS_LINUX | default ""}}'

tasks:
  default:
    desc: List the tasks.
    silent: true
    cmds:
      - task --list

  # ==========================================================================
  # Development builds
  # ==========================================================================

  linux:
    desc: Build the editor for Linux into dist/, with the release runtimes.
    cmds:
      - rm -rf dist || true
      - mkdir dist
      - cp -r resources dist/resources
      - GOOS=linux GOARCH=amd64 CGO_ENABLED=1 go build -v -x -o dist/foundry ./cmd/foundry
      - task: runtime-linux
        vars: {RUNTIMES_DIR: dist/runtimes}

  windows:
    desc: Cross-build the editor for Windows into the OneDrive project directory.
    cmds:
      # 	cp -r resources/* /mnt/c/Users/jcart/OneDrive/Documents/Foundry
      # 	cp resources/SDL2.dll /mnt/c/Users/jcart/OneDrive/Documents/Foundry/SDL2.dll
      # 	cp foundrypack /mnt/c/Users/jcart/OneDrive/Documents/Foundry/foundrypack
      - GOOS=windows GOARCH=amd64 CGO_ENABLED=1 CXX=x86_64-w64-mingw32-g++ CC=x86_64-w64-mingw32-gcc go build -x -v -ldflags '{{.WINDOWS_STATIC}}' -o /mnt/c/Users/jcart/OneDrive/Documents/Foundry/foundry.exe ./cmd/foundry
      # The shaders go with the binary: the engine binds uniforms and attribute
      # locations they declare, so an exe newer than its shaders renders wrong
      # (dynamic lights, explosions). Only the shaders — the rest of resources/
      # is the game project's own content, which the copy above would clobber.
      - cp resources/shaders/* /mnt/c/Users/jcart/OneDrive/Documents/Foundry/resources/shaders/
      - task: runtime-windows
        vars: {RUNTIMES_DIR: /mnt/c/Users/jcart/OneDrive/Documents/Foundry/runtimes}

  sdl:
    desc: Cross-build for Windows against the bundled SDL2, into dist/.
    cmds:
      - rm -rf dist || true
      - mkdir dist
      - cp resources/SDL2.dll dist/SDL2.dll
      - env CGO_ENABLED="1" CC="/usr/bin/x86_64-w64-mingw32-gcc" GOOS="windows" CGO_LDFLAGS="-lmingw32 -lSDL2" CGO_CFLAGS="-D_REENTRANT" go build -v -ldflags '{{.WINDOWS_STATIC}}' -o dist/foundry -x ./cmd/foundry

  run-linux:
    desc: Run the editor built into dist/.
    cmds:
      - ./dist/foundry

  run-windows:
    desc: Run the Windows editor built into dist/.
    cmds:
      - ./dist/foundry.exe

  icon:
    desc: Redraw the editor icon (packaging/icon, internal/editoricon; needs mingw windres).
    cmds:
      - go run ./cmd/genicon

  test:
    desc: Run the tests.
    cmds:
      - go test ./...

  vet:
    desc: Run go vet.
    cmds:
      - go vet ./...

  fmt:
    desc: List the tracked Go files gofmt would change.
    cmds:
      - gofmt -l $(git ls-files '*.go')

  textures:
    desc: Regenerate resources/textures.
    cmds:
      - go run ./cmd/gentextures

  models:
    desc: Regenerate resources/models.
    cmds:
      - go run ./cmd/genmodels

  # ==========================================================================
  # Release runtimes
  # ==========================================================================

  runtimes:
    desc: Build the release game binaries an editor packs a project's content around.
    summary: |
      The release game binaries an editor packs a project's content around.

      An editor running from a game's own project directory has no Foundry
      source beside it to build from, so its Release window looks for them in
      runtimes/ next to itself (internal/release/player.go). This is what puts
      them there:

        task runtimes RUNTIMES_DIR=/path/to/my-game/runtimes

      Rebuild them with the editor beside them: a game binary refuses levels
      compiled by a different version of the compiler, and the editor compiles
      them. `task linux` and `task windows` each build their own platform's.
    run: when_changed
    cmds:
      - task: runtime-linux
        vars: {RUNTIMES_DIR: '{{.RUNTIMES_DIR}}'}
      - task: runtime-windows
        vars: {RUNTIMES_DIR: '{{.RUNTIMES_DIR}}'}

  runtime-linux:
    desc: Build the Linux release game binary into RUNTIMES_DIR.
    run: when_changed
    cmds:
      - mkdir -p {{.RUNTIMES_DIR}}
      - >-
        GOOS=linux GOARCH=amd64 CGO_ENABLED=1
        go build -tags {{.RELEASE_TAGS}} -ldflags "{{.RELEASE_LDFLAGS}}" -o {{.RUNTIMES_DIR}}/foundry-release-linux-amd64 ./cmd/foundry

  runtime-windows:
    desc: Build the Windows release game binary and the installer program into RUNTIMES_DIR.
    run: when_changed
    cmds:
      - mkdir -p {{.RUNTIMES_DIR}}
      - >-
        GOOS=windows GOARCH=amd64 CGO_ENABLED=1
        CXX=x86_64-w64-mingw32-g++ CC=x86_64-w64-mingw32-gcc
        go build -tags {{.RELEASE_TAGS}} -ldflags '{{.WINDOWS_LDFLAGS}} {{.WINDOWS_STATIC}}' -o {{.RUNTIMES_DIR}}/foundry-release-windows-amd64.exe ./cmd/foundry
      # The installer every Windows release is appended to (internal/setup).
      # Pure Go, so no mingw.
      - >-
        GOOS=windows GOARCH=amd64 CGO_ENABLED=0
        go build -ldflags "{{.WINDOWS_LDFLAGS}}" -o {{.RUNTIMES_DIR}}/foundry-setup-windows-amd64.exe ./cmd/foundrysetup

  # ==========================================================================
  # The editor, for a Foundry release
  # ==========================================================================
  #
  # What goes on a GitHub release: the editor itself, for everybody who works
  # on a game made with it. It holds no project — it opens a project folder
  # from wherever its author keeps one (File > Open Project, or `foundry
  # -project <dir>`; see internal/project) — so it installs once and upgrades
  # whole:
  #
  #   foundry-editor-<version>-windows-amd64-setup.exe   Setup.exe, per user, no admin
  #   foundry-editor-<version>-windows-amd64.zip         the same tree, portable
  #   foundry-editor-<version>-linux-amd64.tar.gz        needs libsdl2 on the system
  #
  # Each carries the shaders it was built from (which it reads instead of any
  # project's) and runtimes/ — the release game binaries for both platforms and
  # the Windows installer program — so its Release window can ship a game with
  # nothing else installed.
  #
  # Pushing a v<major>.<minor>.<patch> tag does the rest: the Release editor
  # workflow (.github/workflows/release-editor.yml) runs this with
  # EDITOR_VERSION set to the tag's semver and uploads the three files to that
  # tag's release. By hand, the same thing is:
  #
  #   task dist-editor EDITOR_VERSION=1.2.3
  #   gh release create v1.2.3 build/editor-dist/*

  dist-editor:
    desc: Build the editor for a Foundry GitHub release, both platforms.
    cmds:
      - task: dist-editor-windows
      - task: dist-editor-linux
      - 'echo "dist-editor: {{.EDITOR_DIST}}"; ls -1 {{.EDITOR_DIST}}'

  editor-version:
    desc: Print the version the editor distribution is stamped with.
    silent: true
    cmds:
      - echo "{{.EDITOR_VERSION}}"

  codecs-windows:
    desc: Fetch the OGG Vorbis and MP3 encoder DLLs the Windows editor carries.
    summary: |
      MSYS2's mingw64 builds of libogg, libvorbis, libvorbisenc and LAME's
      libmp3lame, pinned in packaging/codecs/fetch-windows.sh, with their
      licences. The editor loads them at run time for its OGG and MP3 exports;
      nothing links against them and no game carries them.
    status:
      - test -f {{.CODECS_WINDOWS}}/libmp3lame-0.dll
      - test -f {{.CODECS_WINDOWS}}/libvorbisenc-2.dll
    cmds:
      - sh packaging/codecs/fetch-windows.sh {{.CODECS_WINDOWS}}

  editor-runtimes:
    desc: Build the release runtimes the editor distribution carries.
    run: when_changed
    cmds:
      - task: runtimes
        vars: {RUNTIMES_DIR: '{{.EDITOR_RUNTIMES}}'}

  dist-editor-windows:
    desc: Build and pack the Windows editor distribution.
    summary: |
      The Windows editor: a console program, as `task windows` builds it — the
      console is where a crash says what happened, and the git and go processes
      the editor starts would each flash one up under a windowsgui parent.
    deps: [editor-runtimes, codecs-windows]
    cmds:
      - >-
        GOOS=windows GOARCH=amd64 CGO_ENABLED=1
        CXX=x86_64-w64-mingw32-g++ CC=x86_64-w64-mingw32-gcc
        go build -ldflags '{{.WINDOWS_STATIC}}' -o {{.BUILD_DIR}}/foundry-editor-windows.exe ./cmd/foundry
      - >-
        {{.EDITOR_PACK}} -goos windows -exe {{.BUILD_DIR}}/foundry-editor-windows.exe
        -lib resources/SDL2.dll -setup-stub {{.EDITOR_RUNTIMES}}/foundry-setup-windows-amd64.exe
        -codecs {{.CODECS_WINDOWS}}
        -stage {{.BUILD_DIR}}/editor-windows

  dist-editor-linux:
    desc: Build and pack the Linux editor distribution.
    deps: [editor-runtimes]
    cmds:
      - GOOS=linux GOARCH=amd64 CGO_ENABLED=1 go build -o {{.BUILD_DIR}}/foundry-editor-linux ./cmd/foundry
      - '{{.EDITOR_PACK}} -goos linux -exe {{.BUILD_DIR}}/foundry-editor-linux {{if .CODECS_LINUX}}-codecs {{.CODECS_LINUX}}{{end}} -stage {{.BUILD_DIR}}/editor-linux'

  # ==========================================================================
  # Releases and installers
  # ==========================================================================

  compile-levels:
    desc: Compile every level to the form a release build loads.
    summary: |
      Compile every level to the form a release build loads. See
      docs/guide/23-compiling-levels.md, and
      internal/app/levelsource_release.go for why a shipped game reads nothing
      else.
    run: when_changed
    cmds:
      - go run ./cmd/foundrycompile -strict

  release-linux:
    desc: Build the release binary, stage a Linux install tree, then tar it.
    deps: [compile-levels]
    cmds:
      - mkdir -p {{.BUILD_DIR}}
      - >-
        GOOS=linux GOARCH=amd64 CGO_ENABLED=1
        go build -tags {{.RELEASE_TAGS}} -ldflags "{{.RELEASE_LDFLAGS}}" -o {{.BUILD_DIR}}/foundry-release ./cmd/foundry
      - go run ./cmd/foundrypack -goos linux -exe {{.BUILD_DIR}}/foundry-release -out {{.LINUX_STAGE}} {{.PRUNE_FLAG}}
      - cp packaging/linux/install.sh {{.LINUX_STAGE}}/install.sh
      - |
        . {{.LINUX_STAGE}}/.foundrypack
        name=$(basename $EXE)
        tar -czf {{.BUILD_DIR}}/$name-$VERSION-linux-amd64.tar.gz \
            --transform "s,^\.,$name-$VERSION," -C {{.LINUX_STAGE}} .
        echo "release-linux: {{.BUILD_DIR}}/$name-$VERSION-linux-amd64.tar.gz"

  release-windows:
    desc: Cross-build the release binary for Windows and stage an install tree.
    deps: [compile-levels]
    cmds:
      - mkdir -p {{.BUILD_DIR}}
      - >-
        GOOS=windows GOARCH=amd64 CGO_ENABLED=1
        CXX=x86_64-w64-mingw32-g++ CC=x86_64-w64-mingw32-gcc
        go build -tags {{.RELEASE_TAGS}} -ldflags '{{.WINDOWS_LDFLAGS}} {{.WINDOWS_STATIC}}' -o {{.BUILD_DIR}}/foundry-release.exe ./cmd/foundry
      - go run ./cmd/foundrypack -goos windows -exe {{.BUILD_DIR}}/foundry-release.exe -out {{.WINDOWS_STAGE}} {{.PRUNE_FLAG}}
      - 'echo "release-windows: staged in {{.WINDOWS_STAGE}}"'

  installer-linux:
    desc: Build a .deb from the staged Linux tree.
    deps: [release-linux]
    cmds:
      - |
        . {{.LINUX_STAGE}}/.foundrypack
        packaging/linux/make-deb.sh {{.LINUX_STAGE}} {{.BUILD_DIR}}/$(basename $EXE)-$VERSION-amd64.deb

  installer-windows:
    desc: Build a Windows Setup.exe from the staged Windows tree.
    summary: |
      Build a Windows Setup.exe from the staged Windows tree.

      NSIS is not a Go dependency and is not installed by default: `apt install
      nsis` (it cross-packages from Linux, which is the whole reason it is NSIS
      and not Inno Setup).
    deps: [release-windows]
    cmds:
      - |
        command -v makensis >/dev/null 2>&1 || {
          echo "installer-windows: makensis not found. Install it with:  sudo apt install nsis"; exit 1; }
      - |
        . {{.WINDOWS_STAGE}}/.foundrypack
        out={{.BUILD_DIR}}/$(basename ${EXE%.exe})-$VERSION-setup.exe
        makensis -V2 \
          -DAPPNAME="$TITLE" -DVERSION="$VERSION" -DEXENAME="$EXE" \
          -DDATADIR="$DATA_DIR" -DSRCDIR="{{.ROOT_DIR}}/{{.WINDOWS_STAGE}}" \
          -DOUTFILE="{{.ROOT_DIR}}/$out" \
          packaging/windows/installer.nsi && echo "installer-windows: $out"

  release-check:
    desc: Prove the release binary contains no editor, no imgui and no sub-editors.
    summary: |
      Prove the release binary contains no editor, no imgui and no sub-editors.

      The seam in internal/app is a pair of files that have to agree, and
      nothing in the type system makes them: the check that the release half is
      the one being compiled is that none of these packages is reachable from
      the release build's import graph. Cheap enough to run in CI on every
      change.
    silent: true
    cmds:
      - echo "release build's forbidden imports:"
      - |
        if go list -deps -tags {{.RELEASE_TAGS}} ./cmd/foundry \
             | grep -E 'internal/(editor|textureui|imguibackend|uiwin|release|pack)$|imgui-go'; then
          echo "FAIL: a development-only package is linked into the release build"; exit 1
        else
          echo "  none — editor, textureui, imguibackend, uiwin, release, pack and imgui are all absent"
        fi

  test-release:
    desc: Run the tests over the release build's own configuration.
    cmds:
      - go test -tags {{.RELEASE_TAGS}} $(go list -deps -tags {{.RELEASE_TAGS}} ./cmd/foundry | grep foundry/) ./internal/pack

  clean-release:
    desc: Remove the build directory.
    cmds:
      - rm -rf {{.BUILD_DIR}}
